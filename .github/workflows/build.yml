      #   run: |
      #     git clone https://github.com/lancachenet/sniproxy.git
      #     cd sniproxy
      #     docker buildx build --platform linux/amd64,linux/arm64/v8,linux/arm/v7 -t ${{ env.REGISTRY }}/lancache-sniproxy --push .
      #     cd ..

      - name: Build & Push lancachenet/lancache-dns
        run: |
          git clone https://github.com/lancachenet/lancache-dns.git
          cd lancache-dns
          sed -i "1cFROM ${{ env.REGISTRY }}/lancache-ubuntu" Dockerfile
          cat Dockerfile

          for platform in "linux/arm64/v8"; do
            echo "Building for $platform"
            docker buildx build \
              --platform $platform \
              --progress plain \
              -t ${{ env.REGISTRY }}/lancache-dns:${platform//\//-} \
              --push .
          done

          docker manifest create ${{ env.REGISTRY }}/lancache-dns \
            ${{ env.REGISTRY }}/lancache-dns:linux-amd64 \
            ${{ env.REGISTRY }}/lancache-dns:linux-arm64-v8 \
            ${{ env.REGISTRY }}/lancache-dns:linux-arm-v7

          docker manifest push ${{ env.REGISTRY }}/lancache-dns
          cd ..
