name: PR CI

on:
  pull_request:
    branches:
      - main

concurrency:
  group: pr-ci-${{ github.event.pull_request.number }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  REGISTRY: ghcr.io/${{ github.repository_owner }}

jobs:
  validate:
    uses: ./.github/workflows/validate.yml
    permissions:
      contents: read
    with:
      base_sha: ${{ github.event.pull_request.base.sha }}
      head_sha: ${{ github.event.pull_request.head.sha }}

  # Same-repository PRs (including Renovate) are built and pushed to GHCR so
  # downstream jobs can pull the exact tested candidate by digest. Fork PRs
  # never get GHCR credentials; see fork-build-test below. Build logic itself
  # lives in the reusable build-candidates.yml, shared with the release
  # pipeline, rather than being duplicated here.
  build-candidates:
    needs: validate
    if: success() && github.event.pull_request.head.repo.full_name == github.repository
    uses: ./.github/workflows/build-candidates.yml
    permissions:
      contents: read
      packages: write
    with:
      image_tag: pr-${{ github.event.pull_request.number }}-${{ github.event.pull_request.head.sha }}
      # PRs build against each upstream repo's current default branch; only
      # the release pipeline pins to a resolved, recorded commit SHA.
      ubuntu_ref: master
      ubuntu_nginx_ref: master
      monolithic_ref: master
      generic_ref: master
      sniproxy_ref: master
      dns_ref: master

  # Deterministic DNS + cache content integration test (see tests/cache-integration/).
  # Runs against a committed fixture topology (local origin, no public CDN
  # dependency) rather than varying a heartbeat Host header across a matrix of
  # otherwise-identical environments.
  functional-amd64:
    needs: build-candidates
    if: success() && github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    env:
      # docker compose re-interpolates the compose file (and its required
      # DNS_IMAGE/MONOLITHIC_IMAGE) on every invocation, including exec/logs/down,
      # so this must be set at job level rather than only on the first step.
      DNS_IMAGE: ghcr.io/${{ github.repository_owner }}/lancache-dns@${{ needs.build-candidates.outputs.dns_digest }}
      MONOLITHIC_IMAGE: ghcr.io/${{ github.repository_owner }}/lancache-monolithic@${{ needs.build-candidates.outputs.monolithic_digest }}

    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - name: Start fixture topology
        working-directory: tests/cache-integration
        run: docker compose up -d --build

      - name: Run cache integration tests
        working-directory: tests/cache-integration
        run: bash run-integration-tests.sh

      - name: Collect diagnostics
        if: failure()
        working-directory: tests/cache-integration
        run: |
          echo "=== Container status ==="
          docker compose ps
          echo "=== dns logs ==="
          docker compose logs dns
          echo "=== monolithic logs ==="
          docker compose logs monolithic
          echo "=== origin logs ==="
          docker compose logs origin
          echo "=== cache directory ==="
          docker compose exec -T monolithic sh -c 'du -sh /data/cache/cache 2>/dev/null; find /data/cache/cache -type f | head -50' || true

      - name: Cleanup
        if: always()
        working-directory: tests/cache-integration
        run: docker compose down -v || true

  # ARM64 "core integration" per the risk-based architecture matrix in
  # TESTING.md: not the full deterministic content-cache suite (that's
  # AMD64-only, above), but real health/exit-state assertions plus one DNS
  # and one HTTP assertion under actual QEMU emulation -- not just trusting
  # `docker compose ps` to notice a crash.
  functional-arm64:
    needs: build-candidates
    if: success() && github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
    env:
      DNS_IMAGE: ghcr.io/${{ github.repository_owner }}/lancache-dns@${{ needs.build-candidates.outputs.dns_digest }}
      MONOLITHIC_IMAGE: ghcr.io/${{ github.repository_owner }}/lancache-monolithic@${{ needs.build-candidates.outputs.monolithic_digest }}

    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - name: Set up QEMU
        uses: docker/setup-qemu-action@96fe6ef7f33517b61c61be40b68a1882f3264fb8 # v4.2.0

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4.2.0

      - name: Start ARM64 containers
        run: |
          set -euo pipefail
          mkdir -p test-cache/cache test-cache/logs
          chmod 777 test-cache/cache test-cache/logs

          cat > test.env << 'EOF'
          LANCACHE_IP=10.55.0.11
          USE_GENERIC_CACHE=true
          UPSTREAM_DNS=8.8.8.8
          ENABLE_DNSSEC_VALIDATION=false
          CACHE_MAX_AGE=3650d
          EOF

          cat > test-compose-arm64.yml << EOF
          services:
            dns:
              image: ${DNS_IMAGE}
              platform: linux/arm64
              env_file: test.env
              networks:
                lancache_test:
                  ipv4_address: 10.55.0.10
              healthcheck:
                test: ["CMD", "nslookup", "lancache.steamcontent.com", "127.0.0.1"]
                interval: 10s
                timeout: 10s
                retries: 15
                start_period: 30s

            monolithic:
              image: ${MONOLITHIC_IMAGE}
              platform: linux/arm64
              env_file: test.env
              volumes:
                - ./test-cache/cache:/data/cache
                - ./test-cache/logs:/data/logs
              networks:
                lancache_test:
                  ipv4_address: 10.55.0.11
              healthcheck:
                test: ["CMD", "curl", "-fsS", "http://127.0.0.1/lancache-heartbeat"]
                interval: 10s
                timeout: 10s
                retries: 15
                start_period: 45s

          networks:
            lancache_test:
              driver: bridge
              ipam:
                config:
                  - subnet: 10.55.0.0/24
          EOF

          docker compose -f test-compose-arm64.yml up -d

      - name: Wait for containers to be healthy
        run: |
          set -euo pipefail
          for _ in $(seq 1 30); do
            dns_status=$(docker inspect --format '{{.State.Health.Status}}' "$(docker compose -f test-compose-arm64.yml ps -q dns)")
            mono_status=$(docker inspect --format '{{.State.Health.Status}}' "$(docker compose -f test-compose-arm64.yml ps -q monolithic)")
            echo "dns=${dns_status} monolithic=${mono_status}"
            if [ "${dns_status}" = "healthy" ] && [ "${mono_status}" = "healthy" ]; then
              exit 0
            fi
            if [ "${dns_status}" = "unhealthy" ] || [ "${mono_status}" = "unhealthy" ]; then
              echo "::error::a container reported unhealthy"
              exit 1
            fi
            sleep 10
          done
          echo "::error::containers did not become healthy in time"
          exit 1

      - name: Assert neither container has exited
        run: |
          set -euo pipefail
          for svc in dns monolithic; do
            cid=$(docker compose -f test-compose-arm64.yml ps -q "${svc}")
            status=$(docker inspect --format '{{.State.Status}}' "${cid}")
            if [ "${status}" != "running" ]; then
              echo "::error::${svc} container is not running (status: ${status})"
              exit 1
            fi
          done
          echo "Both containers running"

      - name: DNS assertion under ARM64 emulation
        run: |
          set -euo pipefail
          result=$(docker compose -f test-compose-arm64.yml exec -T dns nslookup lancache.steamcontent.com 127.0.0.1 2>/dev/null | grep "^Address:" | tail -1 | awk '{print $2}' | tr -d '\r')
          if [ "${result}" != "10.55.0.11" ]; then
            echo "::error::expected lancache.steamcontent.com to resolve to 10.55.0.11 under ARM64, got '${result}'"
            exit 1
          fi
          echo "DNS resolution OK under ARM64 emulation"

      - name: HTTP assertion under ARM64 emulation
        run: |
          set -euo pipefail
          status=$(docker compose -f test-compose-arm64.yml exec -T monolithic curl -s -o /dev/null -w '%{http_code}' -H 'Host: lancache.steamcontent.com' http://127.0.0.1/lancache-heartbeat)
          if [ "${status}" != "200" ] && [ "${status}" != "204" ]; then
            echo "::error::expected 200/204 from heartbeat under ARM64, got ${status}"
            exit 1
          fi
          echo "HTTP heartbeat OK under ARM64 emulation (status ${status})"

      - name: Collect diagnostics
        if: failure()
        run: |
          docker compose -f test-compose-arm64.yml ps
          docker compose -f test-compose-arm64.yml logs

      - name: Cleanup
        if: always()
        run: |
          docker compose -f test-compose-arm64.yml down -v || true
          rm -rf test-cache test.env test-compose-arm64.yml || true

  # Exercises actions/upload-artifact and actions/download-artifact directly so a
  # Renovate PR bumping either action runs the exact dependency it changes.
  artifact-contracts:
    needs: build-candidates
    if: success() && github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read

    steps:
      - name: Create known artifact content
        run: |
          mkdir -p artifact-contract
          echo "lancache-ci-artifact-contract-check-${{ github.run_id }}" > artifact-contract/marker.txt
          (cd artifact-contract && sha256sum marker.txt > marker.sha256)

      - name: Upload artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: artifact-contract-check-${{ github.run_id }}
          path: artifact-contract/
          retention-days: 1

      - name: Download artifact
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: artifact-contract-check-${{ github.run_id }}
          path: downloaded-artifact-contract/

      - name: Verify downloaded artifact matches what was uploaded
        run: |
          set -euo pipefail
          diff artifact-contract/marker.txt downloaded-artifact-contract/marker.txt
          (cd downloaded-artifact-contract && sha256sum -c marker.sha256)
          echo "✅ actions/upload-artifact and actions/download-artifact round-trip verified"

  # External fork PRs never receive GHCR push credentials (GitHub forces a
  # read-only GITHUB_TOKEN for fork pull_request runs regardless of the
  # `permissions:` declared here). Give them a local, single-arch build/test
  # instead of the registry-backed pipeline above.
  fork-build-test:
    needs: validate
    if: success() && github.event.pull_request.head.repo.full_name != github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read

    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4.2.0

      - name: Build lancachenet/ubuntu (amd64 only, no push)
        run: |
          set -euo pipefail
          git clone https://github.com/lancachenet/ubuntu.git
          cd ubuntu
          docker buildx build --platform linux/amd64 \
            --cache-from "type=registry,ref=${REGISTRY}/lancache-ubuntu:buildcache" \
            -t lancache-ubuntu:fork-local --load .

      - name: Build lancachenet/ubuntu-nginx (amd64 only, no push)
        run: |
          set -euo pipefail
          git clone https://github.com/lancachenet/ubuntu-nginx.git
          cd ubuntu-nginx
          bash "${GITHUB_WORKSPACE}/scripts/pin-base-image.sh" Dockerfile \
            "FROM lancachenet/ubuntu:latest" "FROM lancache-ubuntu:fork-local"
          docker buildx build --platform linux/amd64 \
            --cache-from "type=registry,ref=${REGISTRY}/lancache-ubuntu-nginx:buildcache" \
            -t lancache-ubuntu-nginx:fork-local --load .

      - name: Build lancachenet/monolithic (amd64 only, no push)
        run: |
          set -euo pipefail
          git clone https://github.com/lancachenet/monolithic.git
          cd monolithic
          bash "${GITHUB_WORKSPACE}/scripts/pin-base-image.sh" Dockerfile \
            "FROM lancachenet/ubuntu-nginx:latest" "FROM lancache-ubuntu-nginx:fork-local"
          cp ../20_cache.conf overlay/etc/nginx/sites-available/cache.conf.d/root/20_cache.conf
          docker buildx build --platform linux/amd64 \
            --cache-from "type=registry,ref=${REGISTRY}/lancache-monolithic:buildcache" \
            -t lancache-monolithic:fork-local --load .

      - name: Build lancachenet/lancache-dns (amd64 only, no push)
        run: |
          set -euo pipefail
          git clone https://github.com/lancachenet/lancache-dns.git
          cd lancache-dns
          bash "${GITHUB_WORKSPACE}/scripts/pin-base-image.sh" Dockerfile \
            "FROM lancachenet/ubuntu:latest" "FROM lancache-ubuntu:fork-local"
          docker buildx build --platform linux/amd64 \
            --cache-from "type=registry,ref=${REGISTRY}/lancache-dns:buildcache" \
            -t lancache-dns:fork-local --load .

      - name: Smoke test locally built images
        run: |
          set -euo pipefail
          mkdir -p test-cache/cache test-cache/logs
          chmod 777 test-cache/cache test-cache/logs

          cat > test.env << EOF
          LANCACHE_IP=10.0.0.100
          CACHE_ROOT=$PWD/test-cache
          CACHE_MAX_AGE=3650d
          USE_GENERIC_CACHE=true
          UPSTREAM_DNS=8.8.8.8
          ENABLE_DNSSEC_VALIDATION=false
          EOF

          cat > test-compose-fork.yml << 'EOF'
          services:
            dns:
              image: lancache-dns:fork-local
              env_file: test.env
              ports:
                - "127.0.0.1:5353:53/udp"
              networks:
                lancache_test:
                  ipv4_address: 10.0.0.100

            monolithic:
              image: lancache-monolithic:fork-local
              env_file: test.env
              ports:
                - "127.0.0.1:8080:80/tcp"
              volumes:
                - ./test-cache/cache:/data/cache
                - ./test-cache/logs:/data/logs
              networks:
                lancache_test:
                  ipv4_address: 10.0.0.101

          networks:
            lancache_test:
              driver: bridge
              ipam:
                config:
                  - subnet: 10.0.0.0/24
          EOF

          docker compose -f test-compose-fork.yml up -d
          sleep 30

          docker compose -f test-compose-fork.yml ps

          response=$(curl -s -w "%{http_code}" -o /dev/null http://127.0.0.1:8080/lancache-heartbeat)
          if [ "$response" != "200" ] && [ "$response" != "204" ]; then
            echo "❌ Fork build smoke test failed - HTTP $response"
            docker compose -f test-compose-fork.yml logs
            exit 1
          fi
          echo "✅ Fork-local build smoke test passed (HTTP $response)"

      - name: Cleanup
        if: always()
        run: |
          docker compose -f test-compose-fork.yml down -v || true
          rm -rf test-cache test.env test-compose-fork.yml || true

  ci-gate:
    name: ci-gate
    needs:
      - validate
      - build-candidates
      - functional-amd64
      - functional-arm64
      - artifact-contracts
      - fork-build-test
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - name: Evaluate required results
        env:
          IS_FORK: ${{ github.event.pull_request.head.repo.full_name != github.repository }}
          VALIDATE_RESULT: ${{ needs.validate.result }}
          BUILD_RESULT: ${{ needs.build-candidates.result }}
          AMD64_RESULT: ${{ needs.functional-amd64.result }}
          ARM64_RESULT: ${{ needs.functional-arm64.result }}
          ARTIFACT_RESULT: ${{ needs.artifact-contracts.result }}
          FORK_RESULT: ${{ needs.fork-build-test.result }}
        run: |
          set -euo pipefail
          echo "is_fork=$IS_FORK validate=$VALIDATE_RESULT build=$BUILD_RESULT amd64=$AMD64_RESULT arm64=$ARM64_RESULT artifact=$ARTIFACT_RESULT fork=$FORK_RESULT"

          if [ "$VALIDATE_RESULT" != "success" ]; then
            echo "::error::validate did not succeed ($VALIDATE_RESULT)"
            exit 1
          fi

          if [ "$IS_FORK" = "true" ]; then
            if [ "$FORK_RESULT" != "success" ]; then
              echo "::error::fork-build-test did not succeed ($FORK_RESULT)"
              exit 1
            fi
          else
            failed=0
            for pair in "build-candidates:$BUILD_RESULT" "functional-amd64:$AMD64_RESULT" "functional-arm64:$ARM64_RESULT" "artifact-contracts:$ARTIFACT_RESULT"; do
              name="${pair%%:*}"
              result="${pair##*:}"
              if [ "$result" != "success" ]; then
                echo "::error::$name did not succeed ($result)"
                failed=1
              fi
            done
            if [ "$failed" -ne 0 ]; then
              exit 1
            fi
          fi

          echo "All required checks for this PR passed."
