name: Performance and Load Tests

on:
  workflow_dispatch:
    inputs:
      test_target:
        description: "Test target"
        required: false
        default: "latest"
        type: choice
        options:
          - latest
          - pr
          - custom
      custom_tag:
        description: "Custom image tag (if test_target is custom)"
        required: false
        default: ""
      load_level:
        description: "Load test intensity"
        required: false
        default: "medium"
        type: choice
        options:
          - light
          - medium
          - heavy
          - stress

env:
  REGISTRY: ghcr.io/${{ github.repository_owner }}

permissions:
  contents: read

jobs:
  performance-test:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: read

    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - name: Set up test environment
        run: |
          # Install performance testing tools
          sudo apt-get update
          sudo apt-get install -y apache2-utils wrk curl jq

          # Create test environment
          mkdir -p perf-cache/cache perf-cache/logs test-data
          chmod 777 perf-cache/cache perf-cache/logs

          # Create performance test configuration
          cat > perf-test.env << EOF
          LANCACHE_IP=127.0.0.1
          DNS_BIND_IP=127.0.0.1
          CACHE_ROOT=$PWD/perf-cache
          CACHE_MAX_AGE=3650d
          EOF

      - name: Determine image tags
        id: tags
        run: |
          case "${{ inputs.test_target }}" in
            "latest")
              echo "dns_tag=latest" >> $GITHUB_OUTPUT
              echo "monolithic_tag=latest" >> $GITHUB_OUTPUT
              ;;
            "pr")
              if [ -n "${{ github.event.pull_request.number }}" ]; then
                pr_tag="pr-${{ github.event.pull_request.number }}"
              else
                pr_tag="latest"
              fi
              echo "dns_tag=$pr_tag" >> $GITHUB_OUTPUT
              echo "monolithic_tag=$pr_tag" >> $GITHUB_OUTPUT
              ;;
            "custom")
              custom_tag="${{ inputs.custom_tag }}"
              if [ -z "$custom_tag" ]; then
                custom_tag="latest"
              fi
              echo "dns_tag=$custom_tag" >> $GITHUB_OUTPUT
              echo "monolithic_tag=$custom_tag" >> $GITHUB_OUTPUT
              ;;
          esac

      - name: Start LanCache containers
        run: |
          # Create performance test docker-compose
          cat > perf-compose.yml << EOF
          services:
            dns:
              image: ${{ env.REGISTRY }}/lancache-dns:${{ steps.tags.outputs.dns_tag }}
              env_file: perf-test.env
              ports:
                - "127.0.0.1:5353:53/udp"
                - "127.0.0.1:5353:53/tcp"
              restart: always
              healthcheck:
                test: ["CMD", "nslookup", "steamcontent.com", "127.0.0.1"]
                interval: 30s
                timeout: 10s
                retries: 3
                start_period: 30s

            monolithic:
              image: ${{ env.REGISTRY }}/lancache-monolithic:${{ steps.tags.outputs.monolithic_tag }}
              env_file: perf-test.env
              ports:
                - "127.0.0.1:8080:80/tcp"
                - "127.0.0.1:8443:443/tcp"
              restart: always
              volumes:
                - ./perf-cache/cache:/data/cache
                - ./perf-cache/logs:/data/logs
              healthcheck:
                test: ["CMD", "curl", "-f", "http://127.0.0.1/lancache-heartbeat"]
                interval: 30s
                timeout: 10s
                retries: 3
                start_period: 60s
          EOF

          docker compose -f perf-compose.yml up -d

          # Wait for containers to be healthy
          echo "Waiting for containers to be healthy..."
          timeout 300 bash -c 'until docker compose -f perf-compose.yml ps | grep -q "healthy"; do sleep 5; echo "Still waiting..."; done'

      - name: Create test content
        run: |
          echo "Creating test content for performance testing..."

          # Create various sizes of test files
          mkdir -p test-content

          # Small files (1KB to 1MB)
          dd if=/dev/urandom of=test-content/small-1kb.bin bs=1024 count=1
          dd if=/dev/urandom of=test-content/small-100kb.bin bs=1024 count=100
          dd if=/dev/urandom of=test-content/medium-1mb.bin bs=1048576 count=1

          # Larger files (simulating game content)
          dd if=/dev/urandom of=test-content/large-10mb.bin bs=1048576 count=10
          dd if=/dev/urandom of=test-content/large-50mb.bin bs=1048576 count=50

          # Host files via simple HTTP server for cache testing
          cd test-content
          python3 -m http.server 8081 &
          TEST_SERVER_PID=$!
          echo "TEST_SERVER_PID=$TEST_SERVER_PID" >> $GITHUB_ENV
          cd ..

          # Wait for test server to start
          sleep 2

      - name: DNS Performance Test
        run: |
          echo "Running DNS performance tests..."

          # Test domains for resolution
          test_domains=(
            "steamcontent.com"
            "content.steampowered.com"
            "download.epicgames.com"
            "origin-a.akamaihd.net"
            "blzddist1-a.akamaihd.net"
            "dist.blizzard.com"
            "level3.ssl.blizzard.com"
          )

          total_time=0
          successful_queries=0

          for domain in "${test_domains[@]}"; do
            echo "Testing $domain..."
            start_time=$(date +%s%N)
            result=$(nslookup $domain 127.0.0.1:5353 | grep "Address:" | tail -1 | awk '{print $2}')
            end_time=$(date +%s%N)
            
            if [ "$result" = "127.0.0.1" ]; then
              query_time=$(( (end_time - start_time) / 1000000 ))
              total_time=$((total_time + query_time))
              successful_queries=$((successful_queries + 1))
              echo "✅ $domain resolved in ${query_time}ms"
            else
              echo "❌ $domain failed to resolve correctly"
            fi
          done

          if [ $successful_queries -gt 0 ]; then
            avg_time=$((total_time / successful_queries))
            echo "📊 DNS Performance Summary:" >> $GITHUB_STEP_SUMMARY
            echo "- Successful queries: $successful_queries/${#test_domains[@]}" >> $GITHUB_STEP_SUMMARY
            echo "- Average resolution time: ${avg_time}ms" >> $GITHUB_STEP_SUMMARY
            
            if [ $avg_time -lt 50 ]; then
              echo "✅ DNS performance is excellent (< 50ms)" >> $GITHUB_STEP_SUMMARY
            elif [ $avg_time -lt 100 ]; then
              echo "✅ DNS performance is good (< 100ms)" >> $GITHUB_STEP_SUMMARY
            else
              echo "⚠️ DNS performance is slow (> 100ms)" >> $GITHUB_STEP_SUMMARY
            fi
          fi

      - name: HTTP Performance Test
        run: |
          echo "Running HTTP performance tests..."

          # Basic response time test
          echo "Testing basic HTTP response times..."
          for i in {1..10}; do
            response_time=$(curl -s -w "%{time_total}\n" -o /dev/null http://127.0.0.1:8080/lancache-heartbeat)
            echo "Request $i: ${response_time}s"
          done

      - name: Cache Performance Test
        run: |
          echo "Running cache performance tests..."
           
           # Test cache miss vs cache hit performance
           test_files=("small-1kb.bin" "small-100kb.bin" "medium-1mb.bin")
           
          for file in "${test_files[@]}"; do
            echo "Testing cache performance for $file..."
            
            # Configure nginx to proxy to our test server for this file
            docker compose -f perf-compose.yml exec -T monolithic sh -c '
              mkdir -p /etc/nginx/sites-available/cache.conf.d/
              cat > /etc/nginx/sites-available/cache.conf.d/test-'$file'.conf << EOF
          location /'$file' {
              proxy_pass http://host.docker.internal:8081/'$file';
              include /etc/nginx/sites-available/cache.conf.d/root/*.conf;
          }
          EOF
              nginx -s reload
            '
            
            # Test cache miss (first request)
            echo "Testing cache miss for $file..."
            miss_start=$(date +%s%N)
            curl -s -o /dev/null http://127.0.0.1:8080/$file
            miss_end=$(date +%s%N)
            miss_time=$(( (miss_end - miss_start) / 1000000 ))
            
            # Small delay to ensure cache write completes
            sleep 1
            
            # Test cache hit (second request)
            echo "Testing cache hit for $file..."
            hit_start=$(date +%s%N)
            curl -s -o /dev/null http://127.0.0.1:8080/$file
            hit_end=$(date +%s%N)
            hit_time=$(( (hit_end - hit_start) / 1000000 ))
            
            improvement_ratio=$(echo "scale=2; $miss_time / $hit_time" | bc)
            
            echo "📊 Cache Performance for $file:" >> $GITHUB_STEP_SUMMARY
            echo "- Cache miss: ${miss_time}ms" >> $GITHUB_STEP_SUMMARY
            echo "- Cache hit: ${hit_time}ms" >> $GITHUB_STEP_SUMMARY
            echo "- Speed improvement: ${improvement_ratio}x" >> $GITHUB_STEP_SUMMARY
          done

      - name: Load Test
        run: |
          echo "Running load tests..."

          # Set load test parameters based on input
          case "${{ inputs.load_level }}" in
            "light")
              connections=10
              duration=30
              threads=2
              ;;
            "medium")
              connections=50
              duration=60
              threads=4
              ;;
            "heavy")
              connections=100
              duration=120
              threads=8
              ;;
            "stress")
              connections=200
              duration=180
              threads=12
              ;;
            *)
              connections=50
              duration=60
              threads=4
              ;;
          esac

          echo "Running load test with $connections connections, $threads threads for ${duration}s..."

          # Test with Apache Bench
          echo "Running Apache Bench test..."
          ab -n 1000 -c $connections -t $duration http://127.0.0.1:8080/lancache-heartbeat > ab_results.txt 2>&1 || true

          # Test with wrk if available
          if command -v wrk &> /dev/null; then
            echo "Running wrk test..."
            wrk -t$threads -c$connections -d${duration}s http://127.0.0.1:8080/lancache-heartbeat > wrk_results.txt 2>&1 || true
          fi

          # Parse and display results
          if [ -f ab_results.txt ]; then
            echo "📊 Apache Bench Results:" >> $GITHUB_STEP_SUMMARY
            requests_per_sec=$(grep "Requests per second" ab_results.txt | awk '{print $4}')
            mean_time=$(grep "Time per request.*mean" ab_results.txt | head -1 | awk '{print $4}')
            failed_requests=$(grep "Failed requests" ab_results.txt | awk '{print $3}')
            
            echo "- Requests per second: $requests_per_sec" >> $GITHUB_STEP_SUMMARY
            echo "- Mean time per request: ${mean_time}ms" >> $GITHUB_STEP_SUMMARY
            echo "- Failed requests: $failed_requests" >> $GITHUB_STEP_SUMMARY
          fi

          if [ -f wrk_results.txt ]; then
            echo "" >> $GITHUB_STEP_SUMMARY
            echo "📊 wrk Results:" >> $GITHUB_STEP_SUMMARY
            cat wrk_results.txt >> wrk_summary.txt
            grep -E "(Requests/sec|Latency|Transfer/sec)" wrk_results.txt >> $GITHUB_STEP_SUMMARY || true
          fi

      - name: Memory and Resource Usage
        run: |
          echo "Checking memory and resource usage..."

          # Get container resource usage
          docker stats --no-stream --format "table {{.Container}}\t{{.CPUPerc}}\t{{.MemUsage}}\t{{.MemPerc}}" > resource_usage.txt

          echo "📊 Resource Usage:" >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY
          cat resource_usage.txt >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY

          # Check cache size
          cache_size=$(du -sh perf-cache/cache | cut -f1)
          echo "- Cache size: $cache_size" >> $GITHUB_STEP_SUMMARY

      - name: Generate performance report
        if: always()
        run: |
          echo "## 🚀 Performance Test Results" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**Test Configuration:**" >> $GITHUB_STEP_SUMMARY
          echo "- Target: ${{ inputs.test_target }}" >> $GITHUB_STEP_SUMMARY
          echo "- Load level: ${{ inputs.load_level }}" >> $GITHUB_STEP_SUMMARY
          echo "- Image tags: DNS=${{ steps.tags.outputs.dns_tag }}, Monolithic=${{ steps.tags.outputs.monolithic_tag }}" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY

      - name: Archive test results
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: performance-test-results
          path: |
            ab_results.txt
            wrk_results.txt
            resource_usage.txt
            perf-cache/logs/
          retention-days: 30

      - name: Cleanup
        if: always()
        run: |
          # Stop test server
          if [ -n "$TEST_SERVER_PID" ]; then
            kill $TEST_SERVER_PID || true
          fi

          # Stop containers
          docker compose -f perf-compose.yml down -v || true

          # Clean up test files
          rm -rf perf-cache test-content perf-test.env perf-compose.yml
          rm -f ab_results.txt wrk_results.txt resource_usage.txt wrk_summary.txt
