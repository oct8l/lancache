name: Validate

on:
  push:
    branches:
      - main
  workflow_call:
    inputs:
      base_sha:
        description: "Base commit SHA to diff against for the whitespace check. Defaults to github.event.before for push events."
        required: false
        type: string
      head_sha:
        description: "Head commit SHA to diff against for the whitespace check. Defaults to github.sha."
        required: false
        type: string

permissions:
  contents: read

env:
  # rhysd/actionlint bundles a pinned ShellCheck build, so one image covers both checks.
  ACTIONLINT_IMAGE: rhysd/actionlint:1.7.12@sha256:b1934ee5f1c509618f2508e6eb47ee0d3520686341fec936f3b79331f9315667
  RENOVATE_IMAGE: renovate/renovate:43.270.1@sha256:6f215fca5f89bbc2b4bee880ffd9e5080f40eac592efa7d5572f03c7a4629308

jobs:
  validate:
    name: validate
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          fetch-depth: 0

      - name: "Lint workflows with actionlint (includes ShellCheck on run: steps)"
        run: |
          docker run --rm -v "${{ github.workspace }}:/repo" -w /repo "${ACTIONLINT_IMAGE}" -color

      - name: Validate docker-compose.yml
        run: docker compose -f docker-compose.yml config -q

      - name: Validate cache integration test Compose file
        run: |
          DNS_IMAGE=placeholder MONOLITHIC_IMAGE=placeholder \
            docker compose -f tests/cache-integration/docker-compose.yml config -q

      - name: Validate sniproxy test Compose file
        run: |
          SNIPROXY_IMAGE=placeholder \
            docker compose -f tests/sniproxy/docker-compose.yml config -q

      - name: Validate repository docker-compose.yml with the CI override
        run: |
          DNS_IMAGE=placeholder MONOLITHIC_IMAGE=placeholder \
            docker compose -f docker-compose.yml -f tests/repo-compose/ci-override.yml config -q

      - name: ShellCheck extracted test scripts
        run: |
          mapfile -d '' -t scripts < <(find tests scripts -type f -name '*.sh' -print0)
          if [ "${#scripts[@]}" -gt 0 ]; then
            docker run --rm -v "${{ github.workspace }}:/repo" -w /repo --entrypoint shellcheck \
              "${ACTIONLINT_IMAGE}" "${scripts[@]}"
          fi

      - name: Parse renovate.json with jq
        run: jq empty renovate.json

      - name: Validate renovate.json against schema
        run: |
          docker run --rm -v "${{ github.workspace }}:/repo" -w /repo "${RENOVATE_IMAGE}" \
            renovate-config-validator --strict renovate.json

      - name: Check for whitespace and conflict-marker errors in the diff
        env:
          BASE_SHA: ${{ inputs.base_sha || github.event.before }}
          HEAD_SHA: ${{ inputs.head_sha || github.sha }}
        run: |
          set -euo pipefail

          if [ -z "${BASE_SHA}" ] || ! git cat-file -e "${BASE_SHA}" 2>/dev/null; then
            echo "No usable base revision for this event; skipping git diff --check"
            exit 0
          fi

          git diff --check "${BASE_SHA}" "${HEAD_SHA}"
