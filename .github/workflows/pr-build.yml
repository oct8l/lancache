name: PR image build

on:
  pull_request:
    branches:
      - main

env:
  REGISTRY: ghcr.io/${{ github.repository_owner }}
  PR_TAG: pr-${{ github.event.pull_request.number }}

jobs:

  build:

    runs-on: ubuntu-latest

    steps:

      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6

      - name: Set up QEMU
        uses: docker/setup-qemu-action@c7c53464625b32c7a7e944ae62b3e17d2b600130 # v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3
        with:
          buildkitd-flags: --debug

      - name: Cache Docker layers
        uses: actions/cache@27d5ce7f107fe9357f9df03efb73ab90386fccae # v5
        with:
          path: /tmp/.buildx-cache
          key: ${{ runner.os }}-buildx-${{ github.sha }}
          restore-keys: |
            ${{ runner.os }}-buildx-

      - name: Login to Github Packages
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build & Push lancachenet/ubuntu
        run: |
          git clone https://github.com/lancachenet/ubuntu.git
          cd ubuntu
          cat Dockerfile
          docker buildx build \
            --platform linux/amd64,linux/arm64/v8,linux/arm/v7 \
            --cache-from type=local,src=/tmp/.buildx-cache \
            --cache-to type=local,dest=/tmp/.buildx-cache-new,mode=max \
            -t ${{ env.REGISTRY }}/lancache-ubuntu:${{ env.PR_TAG }} \
            --push .
          cd ..

      - name: Build & Push lancachenet/ubuntu-nginx
        run: |
          git clone https://github.com/lancachenet/ubuntu-nginx.git
          cd ubuntu-nginx
          line_number=$(grep -n "FROM lancachenet/ubuntu:latest" Dockerfile | cut -d: -f1)
          sed -i "${line_number}cFROM ${{ env.REGISTRY }}/lancache-ubuntu:${{ env.PR_TAG }}" Dockerfile
          cat Dockerfile
          docker buildx build \
            --platform linux/amd64,linux/arm64/v8,linux/arm/v7 \
            --cache-from type=local,src=/tmp/.buildx-cache \
            --cache-to type=local,dest=/tmp/.buildx-cache-new,mode=max \
            -t ${{ env.REGISTRY }}/lancache-ubuntu-nginx:${{ env.PR_TAG }} \
            --push .
          cd ..

      - name: Build & Push lancachenet/monolithic
        run: |
          git clone https://github.com/lancachenet/monolithic.git
          cd monolithic
          line_number=$(grep -n "FROM lancachenet/ubuntu-nginx:latest" Dockerfile | cut -d: -f1)
          sed -i "${line_number}cFROM ${{ env.REGISTRY }}/lancache-ubuntu-nginx:${{ env.PR_TAG }}" Dockerfile
          cat Dockerfile
          cp ../20_cache.conf overlay/etc/nginx/sites-available/cache.conf.d/root/20_cache.conf
          docker buildx build \
            --platform linux/amd64,linux/arm64/v8,linux/arm/v7 \
            --cache-from type=local,src=/tmp/.buildx-cache \
            --cache-to type=local,dest=/tmp/.buildx-cache-new,mode=max \
            -t ${{ env.REGISTRY }}/lancache-monolithic:${{ env.PR_TAG }} \
            --push .
          cd ..

      - name: Build & Push lancachenet/generic
        run: |
          git clone https://github.com/lancachenet/generic.git
          cd generic
          line_number=$(grep -n "FROM lancachenet/monolithic:latest" Dockerfile | cut -d: -f1)
          sed -i "${line_number}cFROM ${{ env.REGISTRY }}/lancache-monolithic:${{ env.PR_TAG }}" Dockerfile
          cat Dockerfile
          docker buildx build \
            --platform linux/amd64,linux/arm64/v8,linux/arm/v7 \
            --cache-from type=local,src=/tmp/.buildx-cache \
            --cache-to type=local,dest=/tmp/.buildx-cache-new,mode=max \
            -t ${{ env.REGISTRY }}/lancache-generic:${{ env.PR_TAG }} \
            --push .
          cd ..

      - name: Build & Push lancachenet/sniproxy
        run: |
          git clone https://github.com/lancachenet/sniproxy.git
          cd sniproxy
          docker buildx build \
            --platform linux/amd64,linux/arm64/v8,linux/arm/v7 \
            --cache-from type=local,src=/tmp/.buildx-cache \
            --cache-to type=local,dest=/tmp/.buildx-cache-new,mode=max \
            -t ${{ env.REGISTRY }}/lancache-sniproxy:${{ env.PR_TAG }} \
            --push .
          cd ..

      - name: Build & Push lancachenet/lancache-dns
        run: |
          git clone https://github.com/lancachenet/lancache-dns.git
          cd lancache-dns
          line_number=$(grep -n "FROM lancachenet/ubuntu:latest" Dockerfile | cut -d: -f1)
          sed -i "${line_number}cFROM ${{ env.REGISTRY }}/lancache-ubuntu:${{ env.PR_TAG }}" Dockerfile
          cat Dockerfile
          docker buildx build \
            --platform linux/amd64,linux/arm64/v8,linux/arm/v7 \
            --cache-from type=local,src=/tmp/.buildx-cache \
            --cache-to type=local,dest=/tmp/.buildx-cache-new,mode=max \
            -t ${{ env.REGISTRY }}/lancache-dns:${{ env.PR_TAG }} \
            --push .
          cd ..

      - name: Move cache
        run: |
          rm -rf /tmp/.buildx-cache
          mv /tmp/.buildx-cache-new /tmp/.buildx-cache
