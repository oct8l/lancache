name: Scheduled Build Functionality Tests

on:
  schedule:
    # Run 30 minutes before the main build (which runs at 4:30 AM)
    - cron: "0 4 1,15 * *"
  workflow_dispatch:
    inputs:
      test_level:
        description: "Test level to run"
        required: false
        default: "comprehensive"
        type: choice
        options:
          - basic
          - comprehensive
          - smoke

env:
  REGISTRY: ghcr.io/${{ github.repository_owner }}
  TEST_TAG: pre-release-test-${{ github.run_number }}
  TRIVY_VERSION: v0.71.2

jobs:
  pre-build-test:
    runs-on: ubuntu-latest
    outputs:
      should_proceed: ${{ steps.test_decision.outputs.proceed }}
      test_results: ${{ steps.test_summary.outputs.results }}

    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - name: Set up QEMU
        uses: docker/setup-qemu-action@06116385d9baf250c9f4dcb4858b16962ea869c3 # v4.1.0

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4.2.0

      - name: Login to Github Packages
        uses: docker/login-action@650006c6eb7dba73a995cc03b0b2d7f5ca915bee # v4.2.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build test images for validation
        run: |
          echo "Building test images to validate upstream changes..."

          # Build just the key components for testing (faster than full build)
          git clone https://github.com/lancachenet/ubuntu.git
          cd ubuntu
          docker buildx build --platform linux/amd64,linux/arm64 -t ${{ env.REGISTRY }}/lancache-ubuntu:${{ env.TEST_TAG }} --push .
          cd ..

          git clone https://github.com/lancachenet/ubuntu-nginx.git
          cd ubuntu-nginx
          line_number=$(grep -n "FROM lancachenet/ubuntu:latest" Dockerfile | cut -d: -f1)
          sed -i "${line_number}cFROM ${{ env.REGISTRY }}/lancache-ubuntu:${{ env.TEST_TAG }}" Dockerfile
          docker buildx build --platform linux/amd64,linux/arm64 -t ${{ env.REGISTRY }}/lancache-ubuntu-nginx:${{ env.TEST_TAG }} --push .
          cd ..

          git clone https://github.com/lancachenet/monolithic.git
          cd monolithic
          line_number=$(grep -n "FROM lancachenet/ubuntu-nginx:latest" Dockerfile | cut -d: -f1)
          sed -i "${line_number}cFROM ${{ env.REGISTRY }}/lancache-ubuntu-nginx:${{ env.TEST_TAG }}" Dockerfile
          cp ../20_cache.conf overlay/etc/nginx/sites-available/cache.conf.d/root/20_cache.conf
          docker buildx build --platform linux/amd64,linux/arm64 -t ${{ env.REGISTRY }}/lancache-monolithic:${{ env.TEST_TAG }} --push .
          cd ..

          git clone https://github.com/lancachenet/lancache-dns.git
          cd lancache-dns
          line_number=$(grep -n "FROM lancachenet/ubuntu:latest" Dockerfile | cut -d: -f1)
          sed -i "${line_number}cFROM ${{ env.REGISTRY }}/lancache-ubuntu:${{ env.TEST_TAG }}" Dockerfile
          docker buildx build --platform linux/amd64,linux/arm64 -t ${{ env.REGISTRY }}/lancache-dns:${{ env.TEST_TAG }} --push .
          cd ..

      - name: Test critical functionality
        id: functionality_test
        run: |
          echo "Testing critical LanCache functionality with new images..."

          # Detect a valid RFC 1918 IP (lancache-dns rejects loopback)
          LANCACHE_IP=$(ip -4 route get 1.1.1.1 | awk '{for(i=1;i<=NF;i++) if($i=="src") print $(i+1); exit}')
          echo "Using LANCACHE_IP: $LANCACHE_IP"

          # Create test environment
          mkdir -p test-cache/cache test-cache/logs
          chmod 777 test-cache/cache test-cache/logs

          cat > test.env << EOF
          LANCACHE_IP=$LANCACHE_IP
          DNS_BIND_IP=0.0.0.0
          USE_GENERIC_CACHE=true
          CACHE_ROOT=$PWD/test-cache
          CACHE_MAX_AGE=3650d
          EOF

          # Create test compose with our test images
          cat > test-compose.yml << EOF
          services:
            dns:
              image: ${{ env.REGISTRY }}/lancache-dns:${{ env.TEST_TAG }}
              env_file: test.env
              ports:
                - "0.0.0.0:5353:53/udp"
                - "0.0.0.0:5353:53/tcp"
              restart: always
              healthcheck:
                test: ["CMD", "nslookup", "lancache.steamcontent.com", "127.0.0.1"]
                interval: 30s
                timeout: 10s
                retries: 3
                start_period: 30s

            monolithic:
              image: ${{ env.REGISTRY }}/lancache-monolithic:${{ env.TEST_TAG }}
              env_file: test.env
              ports:
                - "127.0.0.1:8080:80/tcp"
                - "127.0.0.1:8443:443/tcp"
              restart: always
              volumes:
                - ./test-cache/cache:/data/cache
                - ./test-cache/logs:/data/logs
              healthcheck:
                test: ["CMD", "curl", "-f", "http://127.0.0.1/lancache-heartbeat"]
                interval: 30s
                timeout: 10s
                retries: 3
                start_period: 60s
          EOF

          # Start containers
          docker compose -f test-compose.yml up -d

          # Wait for ALL containers to be healthy
          echo "Waiting for containers to be healthy..."
          timeout 300 bash -c 'until [ "$(docker compose -f test-compose.yml ps | grep -c "(healthy)")" -ge 2 ]; do sleep 5; echo "Still waiting..."; done'

          # Test basic functionality
          test_passed=true

          # Test 1: DNS Resolution
          echo "Testing DNS resolution..."
          result=$(dig @127.0.0.1 -p 5353 lancache.steamcontent.com +noall +answer | awk '$4 == "A" {print $5}' | head -1)
          if [ "$result" != "$LANCACHE_IP" ]; then
            echo "❌ DNS test failed - got $result, expected $LANCACHE_IP"
            test_passed=false
          else
            echo "✅ DNS resolution working"
          fi

          # Test 2: HTTP Response
          echo "Testing HTTP response..."
          response=$(curl -s -w "%{http_code}" -o /dev/null http://127.0.0.1:8080/lancache-heartbeat)
          # Accept any 2xx status code (heartbeat endpoint returns 204 No Content)
          if [[ "$response" -lt 200 || "$response" -ge 300 ]]; then
            echo "❌ HTTP test failed - got $response, expected 2xx"
            test_passed=false
          else
            echo "✅ HTTP response working (HTTP $response)"
          fi

          # Test 3: Container Logs for Errors
          echo "Checking container logs for critical errors..."
          if docker compose -f test-compose.yml logs | grep -i "fatal\|critical\|panic" | grep -v "expected"; then
            echo "❌ Critical errors found in logs"
            test_passed=false
          else
            echo "✅ No critical errors in logs"
          fi

          # Cleanup
          docker compose -f test-compose.yml down -v
          rm -rf test-cache test.env test-compose.yml

          if [ "$test_passed" = "true" ]; then
            echo "functionality_result=success" >> $GITHUB_OUTPUT
          else
            echo "functionality_result=failure" >> $GITHUB_OUTPUT
            exit 1
          fi

      - name: Test multi-architecture compatibility
        if: inputs.test_level == 'comprehensive' || inputs.test_level == ''
        id: multiarch_test
        run: |
          echo "Testing ARM64 image compatibility..."

          # Quick ARM64 test - just verify the image can start
          docker run --platform linux/arm64/v8 --rm \
            ${{ env.REGISTRY }}/lancache-ubuntu:${{ env.TEST_TAG }} \
            /bin/bash -c "echo 'ARM64 test successful' && exit 0"

          if [ $? -eq 0 ]; then
            echo "✅ ARM64 compatibility test passed"
            echo "multiarch_result=success" >> $GITHUB_OUTPUT
          else
            echo "❌ ARM64 compatibility test failed"
            echo "multiarch_result=failure" >> $GITHUB_OUTPUT
            exit 1
          fi

      - name: Security scan test images
        if: inputs.test_level == 'comprehensive' || inputs.test_level == ''
        id: security_scan
        run: |
          echo "Running security scans on test images..."

          TRIVY_VER="${TRIVY_VERSION#v}"
          curl -sSfL "https://github.com/aquasecurity/trivy/releases/download/${TRIVY_VERSION}/trivy_${TRIVY_VER}_Linux-64bit.tar.gz" -o /tmp/trivy.tgz
          tar -xzf /tmp/trivy.tgz -C /tmp

          # Scan key images
          scan_passed=true
          images=(
            "${{ env.REGISTRY }}/lancache-ubuntu:${{ env.TEST_TAG }}"
            "${{ env.REGISTRY }}/lancache-monolithic:${{ env.TEST_TAG }}"
            "${{ env.REGISTRY }}/lancache-dns:${{ env.TEST_TAG }}"
          )

          for image in "${images[@]}"; do
            echo "Scanning $image..."
            if /tmp/trivy image --exit-code 1 --severity HIGH,CRITICAL --quiet "$image"; then
              echo "✅ Security scan passed for $image"
            else
              echo "❌ Security scan found vulnerabilities in $image"
              scan_passed=false
            fi
          done

          if [ "$scan_passed" = "true" ]; then
            echo "security_result=success" >> $GITHUB_OUTPUT
          else
            echo "security_result=failure" >> $GITHUB_OUTPUT
            # Don't exit 1 here as security issues might be acceptable for some use cases
          fi

      - name: Test decision
        id: test_decision
        run: |
          functionality="${{ steps.functionality_test.outputs.functionality_result }}"
          multiarch="${{ steps.multiarch_test.outputs.multiarch_result || 'skipped' }}"
          security="${{ steps.security_scan.outputs.security_result || 'skipped' }}"

          echo "Test Results:"
          echo "- Functionality: $functionality"
          echo "- Multi-arch: $multiarch"
          echo "- Security: $security"

          # Functionality test must pass
          if [ "$functionality" != "success" ]; then
            echo "❌ Critical functionality test failed - blocking release"
            echo "proceed=false" >> $GITHUB_OUTPUT
            exit 1
          fi

          # Multi-arch should pass if tested
          if [ "$multiarch" = "failure" ]; then
            echo "❌ Multi-architecture test failed - blocking release"
            echo "proceed=false" >> $GITHUB_OUTPUT
            exit 1
          fi

          # Security is warning only for now
          if [ "$security" = "failure" ]; then
            echo "⚠️  Security scan found issues - proceeding with warning"
          fi

          echo "✅ All critical tests passed - release can proceed"
          echo "proceed=true" >> $GITHUB_OUTPUT

      - name: Test summary
        id: test_summary
        if: always()
        run: |
          functionality="${{ steps.functionality_test.outputs.functionality_result || 'failed' }}"
          multiarch="${{ steps.multiarch_test.outputs.multiarch_result || 'skipped' }}"
          security="${{ steps.security_scan.outputs.security_result || 'skipped' }}"

          echo "results={\"functionality\":\"$functionality\",\"multiarch\":\"$multiarch\",\"security\":\"$security\"}" >> $GITHUB_OUTPUT

      - name: Cleanup test images
        if: always()
        run: |
          echo "Cleaning up test images..."

          # Delete test images to save registry space
          docker buildx imagetools inspect ${{ env.REGISTRY }}/lancache-ubuntu:${{ env.TEST_TAG }} > /dev/null 2>&1 && \
            echo "Deleting ubuntu test image..." || echo "Ubuntu test image not found"

          docker buildx imagetools inspect ${{ env.REGISTRY }}/lancache-ubuntu-nginx:${{ env.TEST_TAG }} > /dev/null 2>&1 && \
            echo "Deleting ubuntu-nginx test image..." || echo "Ubuntu-nginx test image not found"

          docker buildx imagetools inspect ${{ env.REGISTRY }}/lancache-monolithic:${{ env.TEST_TAG }} > /dev/null 2>&1 && \
            echo "Deleting monolithic test image..." || echo "Monolithic test image not found"

          docker buildx imagetools inspect ${{ env.REGISTRY }}/lancache-dns:${{ env.TEST_TAG }} > /dev/null 2>&1 && \
            echo "Deleting dns test image..." || echo "DNS test image not found"

  trigger-main-build:
    needs: pre-build-test
    runs-on: ubuntu-latest
    if: needs.pre-build-test.outputs.should_proceed == 'true'

    steps:
      - name: Trigger main build workflow
        run: |
          echo "✅ Pre-build tests passed! Triggering main build workflow..."

          # Use GitHub CLI to trigger the main build workflow
          gh workflow run build.yml
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Build summary
        run: |
          echo "## 🎉 Scheduled Build Pre-Tests Passed!" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "All critical functionality tests passed. The main build workflow has been triggered." >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### Test Results:" >> $GITHUB_STEP_SUMMARY
          echo "- ✅ **Functionality Tests**: All core features working correctly" >> $GITHUB_STEP_SUMMARY
          echo "- ✅ **Multi-architecture**: Images build and run on ARM64" >> $GITHUB_STEP_SUMMARY
          echo "- ✅ **Security Scan**: No critical vulnerabilities blocking release" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "🚀 **Main build proceeding with confidence!**" >> $GITHUB_STEP_SUMMARY

  notify-failure:
    needs: pre-build-test
    runs-on: ubuntu-latest
    if: needs.pre-build-test.outputs.should_proceed != 'true'

    steps:
      - name: Block build and notify
        run: |
          echo "❌ Pre-build tests failed! Scheduled build has been blocked." >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### Test Results:" >> $GITHUB_STEP_SUMMARY

          results='${{ needs.pre-build-test.outputs.test_results }}'
          echo "Results: $results"

          echo "- Functionality: $(echo $results | jq -r '.functionality // "unknown"')" >> $GITHUB_STEP_SUMMARY
          echo "- Multi-architecture: $(echo $results | jq -r '.multiarch // "unknown"')" >> $GITHUB_STEP_SUMMARY
          echo "- Security: $(echo $results | jq -r '.security // "unknown"')" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "⚠️  **The scheduled build will NOT proceed until these issues are resolved.**" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "Please check the upstream repositories for breaking changes:" >> $GITHUB_STEP_SUMMARY
          echo "- [lancachenet/ubuntu](https://github.com/lancachenet/ubuntu)" >> $GITHUB_STEP_SUMMARY
          echo "- [lancachenet/ubuntu-nginx](https://github.com/lancachenet/ubuntu-nginx)" >> $GITHUB_STEP_SUMMARY
          echo "- [lancachenet/monolithic](https://github.com/lancachenet/monolithic)" >> $GITHUB_STEP_SUMMARY
          echo "- [lancachenet/lancache-dns](https://github.com/lancachenet/lancache-dns)" >> $GITHUB_STEP_SUMMARY

          exit 1
