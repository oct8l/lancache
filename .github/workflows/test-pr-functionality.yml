name: PR Functionality Tests

on:
  pull_request:
    branches:
      - main

env:
  REGISTRY: ghcr.io/${{ github.repository_owner }}
  PR_TAG: pr-${{ github.event.pull_request.number }}

jobs:
  wait-for-build:
    runs-on: ubuntu-latest
    steps:
      - name: Wait for PR build to complete
        uses: fountainhead/action-wait-for-check@v1.2.0
        id: wait-for-build
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          checkName: build
          ref: ${{ github.event.pull_request.head.sha }}

  functional-test-amd64:
    needs: wait-for-build
    runs-on: ubuntu-latest
    strategy:
      matrix:
        test-scenario:
          - steam
          - epic-games
          - origin
          - battle-net
    
    steps:
      - uses: actions/checkout@v4

      - name: Set up test environment
        run: |
          # Create test directories
          mkdir -p test-cache/cache test-cache/logs
          chmod 777 test-cache/cache test-cache/logs

          # Create test .env file
          cat > test.env << EOF
          LANCACHE_IP=127.0.0.1
          DNS_BIND_IP=127.0.0.1
          CACHE_ROOT=$PWD/test-cache
          CACHE_MAX_AGE=3650d
          USE_GENERIC_CACHE=true
          EOF

      - name: Start LanCache containers
        run: |
          # Create test docker-compose.yml with PR images
          cat > test-compose.yml << EOF
          services:
            dns:
              image: ${{ env.REGISTRY }}/lancache-dns:${{ env.PR_TAG }}
              env_file: test.env
              ports:
                - "127.0.0.1:5353:53/udp"
                - "127.0.0.1:5353:53/tcp"
              restart: always
              healthcheck:
                test: ["CMD", "nslookup", "steamcontent.com", "127.0.0.1"]
                interval: 30s
                timeout: 10s
                retries: 3
                start_period: 30s

            monolithic:
              image: ${{ env.REGISTRY }}/lancache-monolithic:${{ env.PR_TAG }}
              env_file: test.env
              ports:
                - "127.0.0.1:8080:80/tcp"
                - "127.0.0.1:8443:443/tcp"
              restart: always
              volumes:
                - ./test-cache/cache:/data/cache
                - ./test-cache/logs:/data/logs
              healthcheck:
                test: ["CMD", "curl", "-f", "http://127.0.0.1/lancache-heartbeat"]
                interval: 30s
                timeout: 10s
                retries: 3
                start_period: 60s
          EOF

          docker compose -f test-compose.yml up -d

          # Wait for containers to be healthy
          echo "Waiting for containers to be healthy..."
          timeout 300 bash -c 'until docker compose -f test-compose.yml ps | grep -q "healthy"; do sleep 5; echo "Still waiting..."; done'

      - name: Test DNS resolution
        run: |
          echo "Testing DNS resolution for CDN domains..."

          # Test domains that should resolve to our cache
          test_domains=(
            "steamcontent.com"
            "content.steampowered.com"
            "download.epicgames.com"
            "origin-a.akamaihd.net"
            "blzddist1-a.akamaihd.net"
          )

          for domain in "${test_domains[@]}"; do
            echo "Testing $domain..."
            # Use dig for better DNS testing with port specification
            result=$(dig @127.0.0.1 -p 5353 +short $domain | head -1)
            if [ "$result" != "127.0.0.1" ]; then
              echo "❌ DNS test failed for $domain - got '$result', expected '127.0.0.1'"
              echo "Debug: Full dig output:"
              dig @127.0.0.1 -p 5353 $domain
              exit 1
            else
              echo "✅ DNS resolution working for $domain"
            fi
          done

      - name: Test cache functionality - ${{ matrix.test-scenario }}
        run: |
          echo "Testing cache functionality for ${{ matrix.test-scenario }}..."

          case "${{ matrix.test-scenario }}" in
            "steam")
              test_url="http://steamcontent.com/depot/test-file"
              ;;
            "epic-games")
              test_url="http://download.epicgames.com/test-file"
              ;;
            "origin")
              test_url="http://origin-a.akamaihd.net/test-file"
              ;;
            "battle-net")
              test_url="http://blzddist1-a.akamaihd.net/test-file"
              ;;
          esac

          # Create test content file
          echo "test-content-${{ matrix.test-scenario }}-$(date +%s)" > test-content.txt

          # First request - should be a cache miss
          echo "Making first request (cache miss expected)..."
          response1=$(curl -s -w "%{http_code}" -o /dev/null \
            -H "Host: $(echo $test_url | cut -d'/' -f3)" \
            http://127.0.0.1:8080/depot/test-file || echo "000")
          
          # Check if cache is working by examining headers
          echo "Checking cache status..."
          cache_status=$(curl -s -I \
            -H "Host: $(echo $test_url | cut -d'/' -f3)" \
            http://127.0.0.1:8080/depot/test-file | grep -i "x-cache" || echo "no-cache-header")
          
          echo "Cache status: $cache_status"
          echo "✅ Cache functionality test completed for ${{ matrix.test-scenario }}"

      - name: Check container health and logs
        if: always()
        run: |
          echo "=== Container Status ==="
          docker compose -f test-compose.yml ps

          echo "=== DNS Container Logs ==="
          docker compose -f test-compose.yml logs dns | tail -50

          echo "=== Monolithic Container Logs ==="
          docker compose -f test-compose.yml logs monolithic | tail -50

          # Check for critical errors (excluding normal nginx config and expected log entries)
          if docker compose -f test-compose.yml logs | grep -i "error\|fatal\|exception" | grep -v -E "(error_log|404|normal|configuration|config.*ok|test.*successful)"; then
            echo "❌ Critical errors found in logs"
            exit 1
          else
            echo "✅ No critical errors in container logs"
          fi

      - name: Cleanup
        if: always()
        run: |
          docker compose -f test-compose.yml down -v || true
          rm -rf test-cache test.env test-compose.yml test-content.txt || true

  functional-test-arm64:
    needs: wait-for-build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Test ARM64 images
        run: |
          echo "Testing ARM64 images can be pulled and started..."
          
          # Create test directories
          mkdir -p test-cache/cache test-cache/logs
          chmod 777 test-cache/cache test-cache/logs

          # Create test .env file
          cat > test.env << EOF
          LANCACHE_IP=127.0.0.1
          DNS_BIND_IP=127.0.0.1
          CACHE_ROOT=$PWD/test-cache
          CACHE_MAX_AGE=3650d
          USE_GENERIC_CACHE=true
          EOF

          # Create docker-compose for ARM64 testing
          cat > test-compose-arm64.yml << EOF
          services:
            dns:
              image: ${{ env.REGISTRY }}/lancache-dns:${{ env.PR_TAG }}
              platform: linux/arm64
              env_file: test.env
              ports:
                - "127.0.0.1:5354:53/udp"

            monolithic:
              image: ${{ env.REGISTRY }}/lancache-monolithic:${{ env.PR_TAG }}
              platform: linux/arm64
              env_file: test.env
              ports:
                - "127.0.0.1:8081:80/tcp"
              volumes:
                - ./test-cache/cache:/data/cache
                - ./test-cache/logs:/data/logs
          EOF

          # Try to start ARM64 containers
          echo "Starting ARM64 containers..."
          docker compose -f test-compose-arm64.yml up -d

          # Wait a bit for containers to start
          sleep 30

          # Check if containers are running
          if docker compose -f test-compose-arm64.yml ps | grep -q "Up"; then
            echo "✅ ARM64 containers started successfully"
          else
            echo "❌ ARM64 containers failed to start"
            docker compose -f test-compose-arm64.yml logs
            exit 1
          fi

          # Cleanup
          docker compose -f test-compose-arm64.yml down -v || true
          rm -rf test-cache test.env test-compose-arm64.yml || true

  test-summary:
    needs: [functional-test-amd64, functional-test-arm64]
    runs-on: ubuntu-latest
    if: always()
    steps:
      - name: Test Results Summary
        run: |
          echo "## 🧪 LanCache PR Functionality Test Results" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          
          if [[ "${{ needs.functional-test-amd64.result }}" == "success" ]]; then
            echo "✅ **AMD64 Functional Tests**: PASSED" >> $GITHUB_STEP_SUMMARY
          else
            echo "❌ **AMD64 Functional Tests**: FAILED" >> $GITHUB_STEP_SUMMARY
          fi
          
          if [[ "${{ needs.functional-test-arm64.result }}" == "success" ]]; then
            echo "✅ **ARM64 Compatibility Tests**: PASSED" >> $GITHUB_STEP_SUMMARY
          else
            echo "❌ **ARM64 Compatibility Tests**: FAILED" >> $GITHUB_STEP_SUMMARY
          fi
          
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**Test Details:**" >> $GITHUB_STEP_SUMMARY
          echo "- DNS resolution for gaming CDNs" >> $GITHUB_STEP_SUMMARY
          echo "- Cache functionality simulation" >> $GITHUB_STEP_SUMMARY
          echo "- Multi-architecture support" >> $GITHUB_STEP_SUMMARY
          echo "- Container health checks" >> $GITHUB_STEP_SUMMARY
