name: Security scan

# Reusable: Trivy-scans every candidate image and uploads SARIF to the
# repo's Security tab. Shared by release.yml (blocking release-gate) and
# pr-ci.yml (blocking ci-gate) so a vulnerability newly disclosed against an
# otherwise-unchanged base image fails a PR the same way it would fail main,
# instead of only surfacing after merge.
#
# `severity: HIGH,CRITICAL` alone is NOT sufficient to limit scan results:
# trivy-action's entrypoint unsets TRIVY_SEVERITY whenever format=sarif
# unless limit-severities-for-sarif is explicitly true, so without it this
# job silently gates on every severity (down to UNKNOWN/LOW), not just
# HIGH/CRITICAL as configured.
on:
  workflow_call:
    inputs:
      registry:
        required: true
        type: string
      ubuntu_digest:
        required: true
        type: string
      ubuntu_nginx_digest:
        required: true
        type: string
      monolithic_digest:
        required: true
        type: string
      generic_digest:
        required: true
        type: string
      sniproxy_digest:
        required: true
        type: string
      dns_digest:
        required: true
        type: string
      trivy_version:
        required: false
        type: string
        # Renovate's customManager (renovate.json) tracks this default via
        # a regex match on this exact line, the same way it tracks
        # DNS_GO_BUILDER_IMAGE in build-candidates.yml.
        default: v0.74.0

permissions:
  contents: read

jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      security-events: write
    steps:
      - name: Scan lancache-ubuntu
        id: scan-ubuntu
        continue-on-error: true
        uses: aquasecurity/trivy-action@d2a0b60797ff03db6132bd4e2b293f9b37081297 # master
        with:
          image-ref: ${{ inputs.registry }}/lancache-ubuntu@${{ inputs.ubuntu_digest }}
          version: ${{ inputs.trivy_version }}
          exit-code: '1'
          ignore-unfixed: true
          vuln-type: 'os,library'
          severity: 'HIGH,CRITICAL'
          limit-severities-for-sarif: true
          format: 'sarif'
          output: 'results-ubuntu.sarif'

      - name: Upload lancache-ubuntu SARIF
        if: always()
        uses: github/codeql-action/upload-sarif@b96794f015dfd88f77b49b1c93e0fa7110f94c63 # v4.38.0
        with:
          sarif_file: results-ubuntu.sarif
          category: lancache-ubuntu

      - name: Scan lancache-ubuntu-nginx
        id: scan-ubuntu-nginx
        continue-on-error: true
        uses: aquasecurity/trivy-action@d2a0b60797ff03db6132bd4e2b293f9b37081297 # master
        with:
          image-ref: ${{ inputs.registry }}/lancache-ubuntu-nginx@${{ inputs.ubuntu_nginx_digest }}
          version: ${{ inputs.trivy_version }}
          exit-code: '1'
          ignore-unfixed: true
          vuln-type: 'os,library'
          severity: 'HIGH,CRITICAL'
          limit-severities-for-sarif: true
          format: 'sarif'
          output: 'results-ubuntu-nginx.sarif'

      - name: Upload lancache-ubuntu-nginx SARIF
        if: always()
        uses: github/codeql-action/upload-sarif@b96794f015dfd88f77b49b1c93e0fa7110f94c63 # v4.38.0
        with:
          sarif_file: results-ubuntu-nginx.sarif
          category: lancache-ubuntu-nginx

      - name: Scan lancache-monolithic
        id: scan-monolithic
        continue-on-error: true
        uses: aquasecurity/trivy-action@d2a0b60797ff03db6132bd4e2b293f9b37081297 # master
        with:
          image-ref: ${{ inputs.registry }}/lancache-monolithic@${{ inputs.monolithic_digest }}
          version: ${{ inputs.trivy_version }}
          exit-code: '1'
          ignore-unfixed: true
          vuln-type: 'os,library'
          severity: 'HIGH,CRITICAL'
          limit-severities-for-sarif: true
          format: 'sarif'
          output: 'results-monolithic.sarif'

      - name: Upload lancache-monolithic SARIF
        if: always()
        uses: github/codeql-action/upload-sarif@b96794f015dfd88f77b49b1c93e0fa7110f94c63 # v4.38.0
        with:
          sarif_file: results-monolithic.sarif
          category: lancache-monolithic

      - name: Scan lancache-generic
        id: scan-generic
        continue-on-error: true
        uses: aquasecurity/trivy-action@d2a0b60797ff03db6132bd4e2b293f9b37081297 # master
        with:
          image-ref: ${{ inputs.registry }}/lancache-generic@${{ inputs.generic_digest }}
          version: ${{ inputs.trivy_version }}
          exit-code: '1'
          ignore-unfixed: true
          vuln-type: 'os,library'
          severity: 'HIGH,CRITICAL'
          limit-severities-for-sarif: true
          format: 'sarif'
          output: 'results-generic.sarif'

      - name: Upload lancache-generic SARIF
        if: always()
        uses: github/codeql-action/upload-sarif@b96794f015dfd88f77b49b1c93e0fa7110f94c63 # v4.38.0
        with:
          sarif_file: results-generic.sarif
          category: lancache-generic

      - name: Scan lancache-sniproxy
        id: scan-sniproxy
        continue-on-error: true
        uses: aquasecurity/trivy-action@d2a0b60797ff03db6132bd4e2b293f9b37081297 # master
        with:
          image-ref: ${{ inputs.registry }}/lancache-sniproxy@${{ inputs.sniproxy_digest }}
          version: ${{ inputs.trivy_version }}
          exit-code: '1'
          ignore-unfixed: true
          vuln-type: 'os,library'
          severity: 'HIGH,CRITICAL'
          limit-severities-for-sarif: true
          format: 'sarif'
          output: 'results-sniproxy.sarif'

      - name: Upload lancache-sniproxy SARIF
        if: always()
        uses: github/codeql-action/upload-sarif@b96794f015dfd88f77b49b1c93e0fa7110f94c63 # v4.38.0
        with:
          sarif_file: results-sniproxy.sarif
          category: lancache-sniproxy

      - name: Scan lancache-dns
        id: scan-dns
        continue-on-error: true
        uses: aquasecurity/trivy-action@d2a0b60797ff03db6132bd4e2b293f9b37081297 # master
        with:
          image-ref: ${{ inputs.registry }}/lancache-dns@${{ inputs.dns_digest }}
          version: ${{ inputs.trivy_version }}
          exit-code: '1'
          ignore-unfixed: true
          vuln-type: 'os,library'
          severity: 'HIGH,CRITICAL'
          limit-severities-for-sarif: true
          format: 'sarif'
          output: 'results-dns.sarif'

      - name: Upload lancache-dns SARIF
        if: always()
        uses: github/codeql-action/upload-sarif@b96794f015dfd88f77b49b1c93e0fa7110f94c63 # v4.38.0
        with:
          sarif_file: results-dns.sarif
          category: lancache-dns

      - name: Fail if any image had blocking findings
        if: always()
        env:
          UBUNTU_OUTCOME: ${{ steps.scan-ubuntu.outcome }}
          UBUNTU_NGINX_OUTCOME: ${{ steps.scan-ubuntu-nginx.outcome }}
          MONOLITHIC_OUTCOME: ${{ steps.scan-monolithic.outcome }}
          GENERIC_OUTCOME: ${{ steps.scan-generic.outcome }}
          SNIPROXY_OUTCOME: ${{ steps.scan-sniproxy.outcome }}
          DNS_OUTCOME: ${{ steps.scan-dns.outcome }}
        run: |
          set -euo pipefail
          failed=0
          for pair in \
            "lancache-ubuntu:${UBUNTU_OUTCOME}" \
            "lancache-ubuntu-nginx:${UBUNTU_NGINX_OUTCOME}" \
            "lancache-monolithic:${MONOLITHIC_OUTCOME}" \
            "lancache-generic:${GENERIC_OUTCOME}" \
            "lancache-sniproxy:${SNIPROXY_OUTCOME}" \
            "lancache-dns:${DNS_OUTCOME}"
          do
            name="${pair%%:*}"
            outcome="${pair##*:}"
            echo "${name}: ${outcome}"
            if [ "${outcome}" != "success" ]; then
              echo "::error::${name} has HIGH/CRITICAL vulnerabilities with an available fix"
              failed=1
            fi
          done
          if [ "${failed}" -ne 0 ]; then
            exit 1
          fi
          echo "All candidate images passed the security scan"
